          .map((step) => "<li>" + escapeHtml(step) + "</li>")
          .join("");
        const preflight = state.runnerPreflight;
        const canRun = Boolean(preflight?.canRun);
        const actions = preflight?.actions || [];
        const disabled = state.runnerRunning || !preview.project || !canRun;
        const executableActions = actions.length
          ? actions.map((action) => renderRunnerAction(action, disabled)).join("")
          : "<div class=\"runner-message\">Preflight를 불러오면 실행 가능한 action이 표시됩니다.</div>";
        const running = state.runnerRunning ? "<div class=\"runner-message\">Runner 실행 중입니다…</div>" : "";
        const error = runnerError() ? "<div class=\"runner-message error\">" + escapeHtml(runnerError()) + "</div>" : "";

        return "<div class=\"runner-preview\">" +
          "<div class=\"runner-head\"><span class=\"runner-title\">Controlled Runner</span><span class=\"runner-project\">" + escapeHtml(selectedProject) + "</span></div>" +
          "<ul class=\"runner-steps\">" + steps + "</ul>" +
          "<div class=\"runner-note\">" + escapeHtml(scopeNote) + "</div>" +
          renderRunnerWarnings(preflight) +
          "<div class=\"runner-actions\">" + executableActions + "</div>" +
          running +
          error +
          renderRunnerResult() +
          "<div class=\"runner-actions\">" +
            renderCommand("Copy dry-run", { agentPrompt: preview.dryRun }) +
            renderCommand("Copy publish", { agentPrompt: preview.publish }) +
          "</div>" +
          "<div class=\"runner-note\">Full publish는 copy-only입니다. 브라우저에서는 validate-source와 publish-dry-run만 서버 preflight가 허용할 때 실행합니다.</div>" +
        "</div>";
      }

      function operationState() {
        const posts = folderScopedPosts();
        const sourceIssues = posts.filter(hasAttention).length;
        const pendingSync = posts.filter((post) => post.publishStatus === "pending-sync").length;
        if (sourceIssues > 0) {
          return { blockedAt: "validate:source", action: "Re-run validate:source", steps: ["failed", "blocked", "blocked", "blocked", "blocked", "blocked"] };
        }
        if (pendingSync > 0) {
          return { blockedAt: "sync", action: "Run sync:posts", steps: ["passed", "failed", "blocked", "blocked", "blocked", "blocked"] };
        }
        return { blockedAt: "none", action: "Run full check", steps: ["passed", "passed", "passed", "passed", "passed", "passed"] };
      }

      function renderPipeline() {
        const flow = operationState();
        const labels = ["Validate source", "Sync posts", "Validate published", "Test", "Build", "Prepare PR"];
        const icons = { passed: "✓", failed: "×", blocked: "⌁" };
        const steps = labels
          .map((label, index) => {
            const status = flow.steps[index];
            const connector = index === 0 ? "" : "<div class=\"connector " + (status === "blocked" ? "blocked" : "") + "\"></div>";
            return connector + "<div class=\"step " + status + "\"><div class=\"step-icon\">" + icons[status] + "</div><span>" + escapeHtml(label) + "</span></div>";
          })
          .join("");
        const summary =
          flow.blockedAt === "none"
            ? "All checks ready"
            : "Blocked at <code style=\"color: var(--error); font-family: var(--font-mono)\">" + escapeHtml(flow.blockedAt) + "</code>";
        document.querySelector("#pipeline").innerHTML =
          "<div class=\"pipeline-summary\"><div class=\"eyebrow\">Operation flow</div><div class=\"pipeline-status\"><span style=\"color: var(--error)\">●</span><span>" + summary + "</span></div></div>" +
          "<div class=\"pipeline-flow\">" + steps + "</div>" +
          renderRunnerPreview();
      }

      function renderTopbar() {
        const attention = allPosts().filter(hasAttention).length;
        document.querySelector("#attention").textContent = attention + " need attention";
        document.querySelector("#crumb-label").textContent = state.activeTab === "content" ? "Content Ops" : "Learning Ops";
        document.querySelector("#scan-label").textContent = "scan " + new Date().toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" });
        document.querySelector("#theme-toggle").textContent = state.theme === "dark" ? "Light" : "Dark";
      }

      function render() {
        renderTopbar();
        renderProjects();
        renderSmartViews();
        renderFilters();
        renderMetrics();
        renderRows();
        renderInspector();
        renderPipeline();
        document.querySelectorAll(".tab").forEach((button) => {
          const active = button.dataset.tab === state.activeTab;
          button.classList.toggle("active", active);
          button.setAttribute("aria-selected", String(active));
        });
      }

      async function copyValue(value, label) {
        const copiedLabel = label || value;
        try {
          await navigator.clipboard.writeText(value);
          state.copied = copiedLabel;
          render();
          setTimeout(() => {
            if (state.copied === copiedLabel) {
              state.copied = null;
              render();
            }
          }, 1400);
        } catch (error) {
          console.warn("Copy failed", error);
        }
      }

      async function loadRunnerPreflight(project = activePublishProjectSlug()) {
        state.runnerPreflight = null;
        state.runnerPreflightError = null;
        if (!project) {
          render();
          return;
        }
        try {
          const response = await fetch("/api/runner/preflight?project=" + encodeURIComponent(project));
          const json = await response.json();
          if (state.activeProject !== project) return;
          state.runnerPreflight = json;
          if (!response.ok) {
            state.runnerPreflightError = json.message || json.error || "Runner preflight failed.";
          }
        } catch (error) {
          if (state.activeProject === project) {
            state.runnerPreflightError = error.message;
          }
        }
        render();
      }

      async function loadInventory() {
        const response = await fetch("/api/inventory");
        state.inventory = await response.json();
        if (!state.selectedId && state.inventory.posts.length > 0) {
          state.selectedId = state.inventory.posts[0].id;
        }
        render();
        await loadRunnerPreflight();
      }

      async function runRunnerAction(action) {
        const project = activePublishProjectSlug();
        if (!project || state.runnerRunning) return;
        const runId = ++state.runnerRunId;
        state.runnerRunning = true;
        state.runnerRunError = null;
        state.runnerResult = null;
        render();
        try {
          const response = await fetch("/api/runner/run", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ action, project }),
          });
          const json = await response.json();
          if (state.runnerRunId !== runId || state.activeProject !== project) return;
          state.runnerResult = json;
          if (!response.ok) {
            state.runnerRunError = json.message || json.error || "Runner action failed.";
          }
        } catch (error) {
          if (state.runnerRunId === runId && state.activeProject === project) {
            state.runnerRunError = error.message;
          }
        } finally {
          state.runnerRunning = false;
          render();
          await loadInventory().catch((error) => {
            if (state.runnerRunId === runId && state.activeProject === project) {
              state.runnerRunError = "Inventory refresh failed: " + error.message;
              render();
            }
          });
        }
      }

      async function readJsonResponse(response) {
        try {
          return await response.json();
        } catch {
          return {};
        }
      }

      function mutationErrorMessage(json, fallback) {
        return json?.message || json?.error || fallback;
      }

      async function postJson(url, body) {
        const response = await fetch(url, {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify(body),
        });
        return { response, json: await readJsonResponse(response) };
      }

      function updateSafeEditApplyButton() {
        const button = document.querySelector("[data-safe-edit-apply]");
        if (button) button.disabled = !(state.safeEditPreview?.canApply && !state.safeEditApplying && !state.mutationApplying);
      }

      function updateFolderCreateApplyButton() {
        const button = document.querySelector("[data-folder-create-apply]");
        if (button) button.disabled = !(state.folderCreatePreview?.canApply && !state.mutationApplying);
      }

      function updateFolderDeleteApplyButton() {
        const button = document.querySelector("[data-folder-delete-apply]");
        const requiredConfirmation = "delete " + state.activeProject;
        if (button) {
          button.disabled = !(
            state.activeProject !== "all" &&
            state.folderDeletePreview?.canApply &&
            state.deleteConfirmation === requiredConfirmation &&
            !state.mutationApplying
          );
        }
      }

      function updateSummaryCountElement() {
        const element = document.querySelector("[data-summary-count]");
        if (!element || !state.safeEditDraft) return;
        const status = summaryLengthStatus(state.safeEditDraft.summary);
        element.className = "summary-count " + status.status;
        element.innerHTML = "<strong>summaryCount</strong> " + escapeHtml(status.label) + " · " + escapeHtml(status.message);
      }

      function markSafeEditDirty() {
        state.safeEditPreview = null;
        updateSafeEditApplyButton();
      }

      function markFolderCreateDirty() {
        state.folderCreatePreview = null;
        updateFolderCreateApplyButton();
      }

      function markFolderDeleteDirty() {
        state.folderDeletePreview = null;
        updateFolderDeleteApplyButton();
      }

      async function openSafeEdit() {
        const post = selectedPost();
        const slug = postSlug(post);
        if (!post?.sourcePath || !post.project || !slug) return;
        state.safeEditError = "";
        state.safeEditPreview = null;
        render();
        try {
          const response = await fetch(
            "/api/safe-edit/post?project=" + encodeURIComponent(post.project) + "&slug=" + encodeURIComponent(slug),
          );
          const json = await readJsonResponse(response);
          if (!response.ok) {
            state.safeEditError = mutationErrorMessage(json, "Safe Edit read failed.");
            render();
            return;
          }
          state.safeEdit = json;
          state.safeEditDraft = editableDraft(json.editable);
          state.safeEditPreview = null;
          state.safeEditError = "";
        } catch (error) {
          state.safeEditError = error.message;
        }
        render();
      }

      async function previewSafeEdit() {
        if (!state.safeEdit || state.safeEditApplying) return;
        state.safeEditError = "";
        render();
        try {
          const { response, json } = await postJson("/api/safe-edit/post/preview", {
            project: state.safeEdit.project,
            slug: state.safeEdit.slug,
            sourceHash: state.safeEdit.sourceHash,
            changes: safeEditChanges(),
          });
          if (!response.ok) {
            state.safeEditPreview = null;
            state.safeEditError = mutationErrorMessage(json, "Safe Edit preview failed.");
            render();
            return;
          }
          state.safeEditPreview = json;
          state.safeEditError = "";
        } catch (error) {
          state.safeEditPreview = null;
          state.safeEditError = error.message;
        }
        render();
      }

      async function applySafeEdit() {
        if (!state.safeEdit || !state.safeEditPreview?.canApply || state.safeEditApplying) return;
        state.safeEditApplying = true;
        state.mutationApplying = true;
        state.safeEditError = "";
        render();
        try {
          const { response, json } = await postJson("/api/safe-edit/post/apply", {
            project: state.safeEdit.project,
            slug: state.safeEdit.slug,
            sourceHash: state.safeEdit.sourceHash,
            changes: safeEditChanges(),
          });
          if (!response.ok) {
            state.safeEditError = mutationErrorMessage(json, "Safe Edit apply failed.");
            render();
            return;
          }
          state.safeEdit = null;
          state.safeEditDraft = null;
          state.safeEditPreview = null;
          await loadInventory();
        } catch (error) {
          state.safeEditError = error.message;
        } finally {
          state.safeEditApplying = false;
          state.mutationApplying = false;
          render();
        }
      }

      async function previewFolderCreate() {
        state.folderCreateError = "";
        render();
        try {
          const { response, json } = await postJson("/api/folders/create/preview", folderCreateInput());
          if (!response.ok) {
            state.folderCreatePreview = null;
            state.folderCreateError = mutationErrorMessage(json, "Folder create preview failed.");
            render();
            return;
          }
          state.folderCreatePreview = json;
          state.folderCreateError = "";
        } catch (error) {
          state.folderCreatePreview = null;
          state.folderCreateError = error.message;
        }
        render();
      }

      async function applyFolderCreate() {
        if (!state.folderCreatePreview?.canApply || state.mutationApplying) return;
        const metadataHash = state.folderCreatePreview.metadataHash;
        if (!metadataHash) {
          state.folderCreateError = "Folder create preview is missing metadataHash.";
          render();
          return;
        }
        state.mutationApplying = true;
        state.folderCreateError = "";
        render();
        try {
          const input = folderCreateInput();
          const { response, json } = await postJson("/api/folders/create/apply", {
            ...input,
            metadataHash,
          });
          if (!response.ok) {
            state.folderCreateError = mutationErrorMessage(json, "Folder create apply failed.");
            render();
            return;
          }
          const nextProject = json.project || input.slug;
          state.activeProject = nextProject;
          state.activeFilter = "all";
          state.selectedId = null;
          state.folderCreateDraft = {
            slug: "",
            name: "",
            projectRoot: "",
            description: "",
            stack: "",
            status: "active",
            featured: false,
            repositoryUrl: "",
            demoUrl: "",
          };
          state.folderCreatePreview = null;
          await loadInventory();
        } catch (error) {
          state.folderCreateError = error.message;
        } finally {
          state.mutationApplying = false;
          render();
        }
      }

      async function previewFolderDelete() {
        if (state.activeProject === "all") {
          state.folderDeleteError = "All Folders에서는 삭제할 수 없습니다. 단일 Folder를 선택하세요.";
          render();
          return;
        }
        state.folderDeleteError = "";
        render();
        try {
          const { response, json } = await postJson("/api/folders/delete/preview", {
            project: state.activeProject,
            removeSourceSetupFolder: state.removeSourceSetupFolder,
          });
          if (!response.ok) {
            state.folderDeletePreview = null;
            state.folderDeleteError = mutationErrorMessage(json, "Folder delete preview failed.");
            render();
            return;
          }
          state.folderDeletePreview = json;
          state.folderDeleteError = "";
        } catch (error) {
          state.folderDeletePreview = null;
          state.folderDeleteError = error.message;
        }
        render();
      }

      async function applyFolderDelete() {
        if (state.activeProject === "all" || !state.folderDeletePreview?.canApply || state.mutationApplying) return;
        const metadataHash = state.folderDeletePreview.metadataHash;
        if (!metadataHash) {
          state.folderDeleteError = "Folder delete preview is missing metadataHash.";
          render();
          return;
        }
        state.mutationApplying = true;
        state.folderDeleteError = "";
        render();
        try {
          const { response, json } = await postJson("/api/folders/delete/apply", {
            project: state.activeProject,
            removeSourceSetupFolder: state.removeSourceSetupFolder,
            confirmation: state.deleteConfirmation,
            metadataHash,
          });
          if (!response.ok) {
            state.folderDeleteError = mutationErrorMessage(json, "Folder delete apply failed.");
            render();
            return;
          }
          state.activeProject = "all";
          state.activeFilter = "all";
          state.selectedId = null;
          state.folderDeletePreview = null;
          state.deleteConfirmation = "";
          state.removeSourceSetupFolder = false;
          await loadInventory();
        } catch (error) {
          state.folderDeleteError = error.message;
        } finally {
          state.mutationApplying = false;
          render();
        }
      }

      function updateSafeEditField(element) {
        if (!state.safeEditDraft) return;
        const field = element.dataset.safeEditField;
        const value = element.type === "checkbox" ? element.checked : element.value;
        state.safeEditDraft = { ...state.safeEditDraft, [field]: value };
        markSafeEditDirty();
        if (field === "summary") updateSummaryCountElement();
      }

      function updateSafeEditTag(element) {
        if (!state.safeEditDraft) return;
        const tag = element.dataset.safeEditTag;
        const tags = new Set(state.safeEditDraft.tags || []);
        if (element.checked) tags.add(tag);
        else tags.delete(tag);
        state.safeEditDraft = { ...state.safeEditDraft, tags: [...tags] };
        markSafeEditDirty();
      }

      function updateFolderCreateField(element) {
        const field = element.dataset.folderCreateField;
        const value = element.type === "checkbox" ? element.checked : element.value;
        state.folderCreateDraft = { ...state.folderCreateDraft, [field]: value };
        markFolderCreateDirty();
      }

      function handleMutationFieldEvent(event, { rerender = false } = {}) {
        const target = event.target;
        if (!target?.matches) return;

        if (target.matches("[data-safe-edit-field]")) {
          updateSafeEditField(target);
          if (rerender) render();
          return;
        }

        if (target.matches("[data-safe-edit-tag]")) {
          updateSafeEditTag(target);
          if (rerender) render();
          return;
        }

        if (target.matches("[data-folder-create-field]")) {
          updateFolderCreateField(target);
          if (rerender) render();
          return;
        }

        if (target.matches("[data-folder-delete-remove-setup]")) {
          state.removeSourceSetupFolder = target.checked;
          markFolderDeleteDirty();
          if (rerender) render();
          return;
        }

        if (target.matches("[data-folder-delete-confirmation]")) {
          state.deleteConfirmation = target.value;
          updateFolderDeleteApplyButton();
          if (rerender) render();
        }
      }

      document.addEventListener("click", (event) => {
        const projectButton = event.target.closest("[data-project]");
        if (projectButton) {
          state.activeProject = projectButton.dataset.project;
          state.activeFilter = "all";
          state.selectedId = null;
          state.safeEdit = null;
          state.safeEditDraft = null;
          state.safeEditPreview = null;
          state.safeEditError = "";
          state.folderDeletePreview = null;
          state.folderDeleteError = "";
          state.deleteConfirmation = "";
          state.runnerPreflight = null;
          state.runnerResult = null;
          state.runnerPreflightError = null;
          state.runnerRunError = null;
          render();
          loadRunnerPreflight().catch((error) => {
            state.runnerPreflightError = error.message;
            render();
          });
          return;
        }

        const smartViewButton = event.target.closest("[data-smart-view]");
        if (smartViewButton) {
          state.activeSmartView = smartViewButton.dataset.smartView;
          state.activeFilter = "all";
          state.selectedId = null;
          render();
          return;
        }

        const filterButton = event.target.closest("[data-filter]");
        if (filterButton) {
          state.activeFilter = filterButton.dataset.filter;
          state.selectedId = null;
          render();
          return;
        }

        const tabButton = event.target.closest("[data-tab]");
        if (tabButton) {
          state.activeTab = tabButton.dataset.tab;
          state.activeFilter = "all";
          state.selectedId = null;
          render();
          return;
        }

        const postButton = event.target.closest("[data-post]");
        if (postButton) {
          state.selectedId = postButton.dataset.post;
          state.safeEdit = null;
          state.safeEditDraft = null;
          state.safeEditPreview = null;
          state.safeEditError = "";
          render();
          return;
        }

        const copyButton = event.target.closest("[data-copy]");
        if (copyButton) {
          copyValue(copyButton.dataset.copy, copyButton.dataset.copyLabel || copyButton.dataset.copy);
          return;
        }

        if (event.target.closest("[data-safe-edit-open]")) {
          openSafeEdit();
          return;
        }

        if (event.target.closest("[data-safe-edit-preview]")) {
          previewSafeEdit();
          return;
        }

        if (event.target.closest("[data-safe-edit-apply]")) {
          applySafeEdit();
          return;
        }

        if (event.target.closest("[data-folder-create-preview]")) {
          previewFolderCreate();
          return;
        }

        if (event.target.closest("[data-folder-create-apply]")) {
          applyFolderCreate();
          return;
        }

        if (event.target.closest("[data-folder-delete-preview]")) {
          previewFolderDelete();
          return;
        }

        if (event.target.closest("[data-folder-delete-apply]")) {
          applyFolderDelete();
          return;
        }

        const runnerButton = event.target.closest("[data-run-action]");
        if (runnerButton) {
          runRunnerAction(runnerButton.dataset.runAction);
        }
      });

      document.addEventListener("input", (event) => handleMutationFieldEvent(event));
      document.addEventListener("change", (event) => handleMutationFieldEvent(event, { rerender: true }));

      document.querySelector("#refresh").addEventListener("click", loadInventory);
      document.querySelector("#theme-toggle").addEventListener("click", () => {
        state.theme = state.theme === "dark" ? "light" : "dark";
        localStorage.setItem("blogOpsTheme", state.theme);
        document.documentElement.dataset.theme = state.theme;
        render();
      });
      document.querySelector("#mobile-detail").addEventListener("click", () => {
        const post = selectedPost();
        if (post) alert(post.title + "\\n\\n" + nextAction(post));
      });

      loadInventory().catch((error) => {
        document.querySelector("#rows").innerHTML = "<div class=\"empty\">Inventory를 불러오지 못했습니다: " + escapeHtml(error.message) + "</div>";
      });
    </script>
  </body>
</html>
