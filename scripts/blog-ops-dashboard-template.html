<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Blog Ops Dashboard</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <style>
      :root {
        color-scheme: light;
        --window-bg: #e9ebef;
        --panel: #ffffff;
        --panel-alt: #f5f6f8;
        --panel-inset: #fbfcfd;
        --text: #1d1f24;
        --text-sec: #6a6f78;
        --text-tertiary: #9aa0a9;
        --border: #e6e8ec;
        --border-strong: #d7dade;
        --divider: #edeef1;
        --accent: #0a6cff;
        --accent-soft: rgba(10, 108, 255, 0.1);
        --accent-soft-strong: rgba(10, 108, 255, 0.16);
        --row-hover: #f3f5f8;
        --row-selected: rgba(10, 108, 255, 0.07);
        --code-bg: #f4f5f7;
        --code-border: #e6e8ec;
        --shadow-sm: 0 1px 2px rgba(20, 24, 34, 0.05);
        --shadow-md: 0 4px 18px rgba(20, 24, 34, 0.08);
        --font-sans: "Pretendard", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        --font-mono: "SF Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        --ok: #2f8f5b;
        --ok-bg: rgba(47, 143, 91, 0.11);
        --info: #3a7cc0;
        --info-bg: rgba(58, 124, 192, 0.12);
        --warn: #bd7b2a;
        --warn-bg: rgba(189, 123, 42, 0.13);
        --error: #c0493b;
        --error-bg: rgba(192, 73, 59, 0.1);
        --quiet: #7c818b;
        --quiet-bg: rgba(124, 129, 139, 0.12);
        --unknown: #8a7da6;
        --unknown-bg: rgba(138, 125, 166, 0.13);
      }

      [data-theme="dark"] {
        color-scheme: dark;
        --window-bg: #16181b;
        --panel: #25272c;
        --panel-alt: #1e2024;
        --panel-inset: #2b2e33;
        --text: #e8e9ec;
        --text-sec: #9a9fa8;
        --text-tertiary: #6a6f78;
        --border: rgba(255, 255, 255, 0.08);
        --border-strong: rgba(255, 255, 255, 0.14);
        --divider: rgba(255, 255, 255, 0.06);
        --accent: #4a93ff;
        --accent-soft: rgba(74, 147, 255, 0.15);
        --accent-soft-strong: rgba(74, 147, 255, 0.24);
        --row-hover: rgba(255, 255, 255, 0.04);
        --row-selected: rgba(74, 147, 255, 0.13);
        --code-bg: #1b1d21;
        --code-border: rgba(255, 255, 255, 0.08);
        --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4);
        --shadow-md: 0 8px 28px rgba(0, 0, 0, 0.45);
        --ok: #5bc088;
        --ok-bg: rgba(91, 192, 136, 0.15);
        --info: #6aa6ec;
        --info-bg: rgba(106, 166, 236, 0.15);
        --warn: #e0a557;
        --warn-bg: rgba(224, 165, 87, 0.16);
        --error: #e0796b;
        --error-bg: rgba(224, 121, 107, 0.15);
        --quiet: #9aa0aa;
        --quiet-bg: rgba(154, 160, 170, 0.14);
        --unknown: #b4a3d6;
        --unknown-bg: rgba(180, 163, 214, 0.16);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        background: var(--window-bg);
        color: var(--text);
        font-family: var(--font-sans);
        -webkit-font-smoothing: antialiased;
      }

      button,
      input,
      select,
      textarea {
        font: inherit;
      }

      button {
        cursor: pointer;
      }

      button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      ::selection {
        background: rgba(10, 108, 255, 0.18);
      }

      .app {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      .topbar {
        height: 52px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 0 16px 0 18px;
        background: var(--panel);
        border-bottom: 1px solid var(--border);
      }

      .traffic {
        display: inline-flex;
        gap: 8px;
        align-items: center;
      }

      .traffic span {
        width: 12px;
        height: 12px;
        border-radius: 999px;
        box-shadow: inset 0 0 0 0.5px rgba(0, 0, 0, 0.12);
      }

      .traffic span:nth-child(1) {
        background: #ec6a5e;
      }

      .traffic span:nth-child(2) {
        background: #f4bf4f;
      }

      .traffic span:nth-child(3) {
        background: #61c554;
      }

      .brand {
        display: flex;
        align-items: baseline;
        gap: 9px;
        min-width: 0;
      }

      .brand strong {
        font-size: 14px;
        font-weight: 650;
        letter-spacing: -0.1px;
        white-space: nowrap;
      }

      .brand span,
      .crumb,
      .scan {
        color: var(--text-tertiary);
        font-family: var(--font-mono);
        font-size: 11.5px;
        white-space: nowrap;
      }

      .crumb {
        display: flex;
        align-items: center;
        gap: 7px;
        color: var(--text-sec);
      }

      .topbar-spacer {
        flex: 1;
      }

      .attention {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 4px 10px;
        border-radius: 7px;
        background: var(--warn-bg);
        color: var(--warn);
        font-family: var(--font-mono);
        font-size: 11.5px;
        white-space: nowrap;
      }

      .attention::before {
        content: "";
        width: 7px;
        height: 7px;
        border-radius: 999px;
        background: var(--warn);
      }

      .top-button {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        height: 30px;
        padding: 0 12px;
        border: 1px solid var(--border);
        border-radius: 7px;
        background: var(--panel-alt);
        color: var(--text);
        font-size: 12.5px;
        font-weight: 550;
      }

      .layout {
        flex: 1;
        min-height: 0;
        display: grid;
        grid-template-columns: 220px minmax(0, 1fr) 340px;
      }

      .sidebar {
        min-width: 0;
        background: var(--panel-alt);
        border-right: 1px solid var(--border);
        padding: 14px 10px 0;
        display: flex;
        flex-direction: column;
      }

      .searchbox {
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 34px;
        padding: 5px 10px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--text-tertiary);
        font-size: 12.5px;
        margin-bottom: 18px;
      }

      .kbd {
        margin-left: auto;
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 0 5px;
        color: var(--text-tertiary);
        font-family: var(--font-mono);
        font-size: 11px;
      }

      .group-label {
        color: var(--text-tertiary);
        font-family: var(--font-mono);
        font-size: 10.5px;
        letter-spacing: 0.6px;
        margin: 0 8px 8px;
        text-transform: uppercase;
      }

      .nav-group {
        margin-bottom: 20px;
      }

      .nav-row {
        width: 100%;
        min-height: 38px;
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 5px 9px;
        border: 0;
        border-radius: 7px;
        color: var(--text);
        background: transparent;
        text-align: left;
      }

      .nav-row:hover {
        background: var(--row-hover);
      }

      .nav-row.active {
        color: var(--accent);
        background: var(--accent-soft);
      }

      .nav-name {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 13px;
      }

      .nav-text {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .nav-sub {
        overflow: hidden;
        color: var(--text-tertiary);
        font-family: var(--font-mono);
        font-size: 10.5px;
        line-height: 1.2;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .folder-help {
        margin: -10px 8px 16px;
        color: var(--text-tertiary);
        font-size: 11px;
        line-height: 1.45;
      }

      .nav-row .count {
        flex-shrink: 0;
      }

      .nav-row.active .nav-name {
        font-weight: 600;
      }

      .count {
        min-width: 18px;
        border-radius: 20px;
        background: var(--panel);
        color: var(--text-tertiary);
        font-family: var(--font-mono);
        font-size: 11px;
        font-variant-numeric: tabular-nums;
        padding: 1px 7px;
        text-align: center;
      }

      .local-state {
        margin-top: auto;
        border-top: 1px solid var(--border);
        padding: 12px 8px 14px;
        display: flex;
        flex-direction: column;
        gap: 7px;
        color: var(--text-tertiary);
        font-family: var(--font-mono);
        font-size: 11px;
      }

      .main {
        min-width: 0;
        background: var(--panel);
        display: flex;
        flex-direction: column;
      }

      .metrics {
        display: grid;
        grid-template-columns: repeat(6, minmax(0, 1fr));
        gap: 0;
        padding: 16px 22px;
        border-bottom: 1px solid var(--border);
      }

      .metric {
        min-width: 0;
        padding-left: 22px;
        border-left: 1px solid var(--divider);
      }

      .metric:first-child {
        padding-left: 0;
        border-left: 0;
      }

      .metric strong {
        display: block;
        color: var(--text);
        font-size: 23px;
        font-weight: 680;
        font-variant-numeric: tabular-nums;
        letter-spacing: -0.5px;
        line-height: 1.1;
      }

      .metric span {
        display: block;
        margin-top: 5px;
        color: var(--text-sec);
        font-family: var(--font-mono);
        font-size: 11px;
        letter-spacing: 0.1px;
      }

      .metric.attention-metric strong {
        color: var(--error);
      }

      .tabs {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 12px 22px 0;
      }

      .tab-list {
        display: inline-flex;
        gap: 0;
        padding: 3px;
        border: 1px solid var(--border);
        border-radius: 9px;
        background: var(--panel-alt);
      }

      .tab {
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: var(--text-sec);
        padding: 6px 16px;
        font-size: 13px;
        font-weight: 500;
      }

      .tab.active {
        background: var(--panel);
        color: var(--text);
        box-shadow: var(--shadow-sm);
        font-weight: 600;
      }

      .tab-meta {
        margin-left: auto;
        color: var(--text-tertiary);
        font-family: var(--font-mono);
        font-size: 11.5px;
        white-space: nowrap;
      }

      .rows {
        margin-top: 12px;
        min-height: 0;
        overflow: auto;
      }

      .row-head,
      .post-row {
        display: grid;
        align-items: center;
        gap: 14px;
        padding: 0 22px;
      }

      .row-head {
        height: 32px;
        border-bottom: 1px solid var(--border);
        color: var(--text-tertiary);
        font-family: var(--font-mono);
        font-size: 10.5px;
        letter-spacing: 0.5px;
        text-transform: uppercase;
      }

      .content-grid {
        grid-template-columns: 142px minmax(130px, 1fr) 92px 88px 118px;
      }

      .learning-grid {
        grid-template-columns: 150px minmax(130px, 1fr) 92px 178px 86px;
      }

      .post-row {
        min-height: 42px;
        border: 0;
        border-bottom: 1px solid var(--divider);
        width: 100%;
        background: transparent;
        color: inherit;
        text-align: left;
        position: relative;
      }

      .post-row:hover {
        background: var(--row-hover);
      }

      .post-row.selected {
        background: var(--row-selected);
        box-shadow: inset 2px 0 0 var(--accent);
      }

      .title-cell {
        min-width: 0;
        overflow: hidden;
        color: var(--text);
        font-size: 13.5px;
        font-weight: 480;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .small-cell {
        min-width: 0;
        overflow: hidden;
        color: var(--text-sec);
        font-size: 12.5px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .mono-cell {
        min-width: 0;
        overflow: hidden;
        color: var(--text-sec);
        font-family: var(--font-mono);
        font-size: 11.5px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .status-dot {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        min-width: 0;
        color: var(--status-fg, var(--text-sec));
        font-family: var(--font-mono);
        font-size: 12px;
        letter-spacing: 0.1px;
      }

      .status-dot::before {
        content: "";
        flex-shrink: 0;
        width: 7px;
        height: 7px;
        border-radius: 999px;
        background: var(--status-fg, var(--text-sec));
        box-shadow: 0 0 0 3px var(--status-bg, transparent);
      }

      .chip,
      .warn-pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border-radius: 6px;
        background: var(--status-bg, var(--quiet-bg));
        color: var(--status-fg, var(--quiet));
        font-family: var(--font-mono);
        font-size: 11.5px;
        line-height: 1.3;
        padding: 3px 9px;
        white-space: nowrap;
      }

      .chip::before {
        content: "";
        width: 5.5px;
        height: 5.5px;
        border-radius: 999px;
        background: var(--status-fg, var(--quiet));
      }

      .warn-pill {
        font-size: 11px;
        padding: 2px 7px 2px 6px;
      }

      .tick-pair {
        display: inline-flex;
        gap: 12px;
        color: var(--text-sec);
        font-family: var(--font-mono);
        font-size: 11.5px;
      }

      .tick-pair span.missing {
        color: var(--text-tertiary);
      }

      .warning-list,
      .tag-list {
        min-width: 0;
        overflow: hidden;
        display: flex;
        gap: 6px;
      }

      .inspector {
        min-width: 0;
        background: var(--panel-alt);
        border-left: 1px solid var(--border);
        display: flex;
        flex-direction: column;
      }

      .inspector-head {
        padding: 18px 20px 16px;
        border-bottom: 1px solid var(--border);
      }

      .eyebrow {
        color: var(--text-tertiary);
        font-family: var(--font-mono);
        font-size: 10.5px;
        letter-spacing: 0.6px;
        text-transform: uppercase;
      }

      .inspector-title-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 11px;
      }

      .inspector h2 {
        margin: 0;
        color: var(--text);
        font-size: 16.5px;
        font-weight: 650;
        letter-spacing: -0.2px;
        line-height: 1.35;
      }

      .inspector-sub {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 9px;
        color: var(--text-sec);
        font-size: 12.5px;
      }

      .inspector-sub code {
        color: var(--text-tertiary);
        font-family: var(--font-mono);
        font-size: 11.5px;
      }

      .inspector-body {
        min-height: 0;
        overflow: auto;
        padding: 16px 20px;
      }

      .section-title {
        margin: 0 0 10px;
        color: var(--text-tertiary);
        font-family: var(--font-mono);
        font-size: 10.5px;
        letter-spacing: 0.6px;
        text-transform: uppercase;
      }

      .mutation-section {
        border-top: 1px solid var(--divider);
        padding: 16px 0 0;
        margin-top: 16px;
      }

      .mutation-section:first-child {
        border-top: 0;
        margin-top: 0;
        padding-top: 0;
      }

      .mutation-section h2 {
        margin-bottom: 8px;
      }

      .mutation-fields {
        display: grid;
        gap: 10px;
        margin-top: 12px;
      }

      .mutation-fields label,
      .mutation-label {
        display: grid;
        gap: 5px;
        color: var(--text-sec);
        font-size: 12px;
        line-height: 1.4;
      }

      .mutation-fields input[type="text"],
      .mutation-fields input[type="url"],
      .mutation-fields select,
      .mutation-fields textarea,
      .confirmation-input {
        width: 100%;
        min-width: 0;
        border: 1px solid var(--border);
        border-radius: 7px;
        background: var(--panel);
        color: var(--text);
        font-size: 12.5px;
        padding: 7px 9px;
      }

      .mutation-fields textarea {
        min-height: 78px;
        resize: vertical;
      }

      .readonly-grid {
        display: grid;
        grid-template-columns: 70px minmax(0, 1fr);
        gap: 6px 10px;
        margin: 10px 0 12px;
        color: var(--text-tertiary);
        font-family: var(--font-mono);
        font-size: 11px;
      }

      .readonly-grid strong {
        min-width: 0;
        color: var(--text-sec);
        font-weight: 500;
        overflow-wrap: anywhere;
      }

      .button-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 12px;
      }

      .button {
        min-height: 30px;
        border: 1px solid var(--border);
        border-radius: 7px;
        background: var(--panel);
        color: var(--text);
        font-size: 12px;
        font-weight: 600;
        padding: 6px 10px;
      }

      .button.primary {
        border-color: transparent;
        background: var(--accent);
        color: #fff;
      }

      .button:disabled {
        cursor: not-allowed;
        opacity: 0.5;
      }

      .muted {
        margin: 7px 0 0;
        color: var(--text-sec);
        font-size: 11.5px;
        line-height: 1.45;
      }

      .summary-count {
        border-radius: 7px;
        padding: 7px 9px;
        background: var(--quiet-bg);
        color: var(--quiet);
        font-size: 11.5px;
        line-height: 1.45;
      }

      .summary-count.good {
        background: var(--ok-bg);
        color: var(--ok);
      }

      .summary-count.warning {
        background: var(--warn-bg);
        color: var(--warn);
      }

      .summary-count.error {
        background: var(--error-bg);
        color: var(--error);
      }

      .tag-picker {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .tag-option,
      .mutation-check {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border-radius: 6px;
        color: var(--text-sec);
        font-size: 11.5px;
        line-height: 1.3;
      }

      .tag-option {
        border: 1px solid var(--border);
        background: var(--panel);
        padding: 5px 7px;
      }

      .mutation-check input,
      .tag-option input {
        width: auto;
        margin: 0;
      }

      .mutation-preview {
        margin-top: 12px;
        display: grid;
        gap: 8px;
      }

      .mutation-message {
        padding: 8px 9px;
        border: 1px solid var(--border);
        border-radius: 7px;
        background: var(--panel);
        color: var(--text-sec);
        font-size: 11.5px;
        line-height: 1.45;
      }

      .mutation-message.good {
        border-color: var(--ok-bg);
        background: var(--ok-bg);
        color: var(--ok);
      }

      .mutation-message.warning {
        border-color: var(--warn-bg);
        background: var(--warn-bg);
        color: var(--warn);
      }

      .mutation-message.error {
        border-color: var(--error-bg);
        background: var(--error-bg);
        color: var(--error);
      }

      .mutation-list,
      .readiness-list {
        display: grid;
        gap: 6px;
        margin: 7px 0 0;
        padding: 0;
        list-style: none;
      }

      .mutation-list li,
      .readiness-list li {
        min-width: 0;
        overflow-wrap: anywhere;
      }

      .mutation-list code {
        color: inherit;
        font-family: var(--font-mono);
        font-size: 11px;
      }

      .readiness-list li {
        display: grid;
        gap: 2px;
        border-left: 2px solid var(--border-strong);
        padding-left: 8px;
      }

      .readiness-list li.passed {
        border-left-color: var(--ok);
      }

      .readiness-list li.blocked {
        border-left-color: var(--error);
      }

      .folder-management details {
        border-top: 1px solid var(--divider);
        padding-top: 12px;
        margin-top: 12px;
      }

      .folder-management summary {
        cursor: pointer;
        color: var(--text);
        font-size: 13px;
        font-weight: 650;
      }

      .meta-row {
        display: flex;
        gap: 12px;
        align-items: baseline;
        padding: 7px 0;
      }

      .meta-row dt {
        width: 70px;
        flex-shrink: 0;
        margin: 0;
        color: var(--text-tertiary);
        font-family: var(--font-mono);
        font-size: 11px;
        letter-spacing: 0.2px;
      }

      .meta-row dd {
        min-width: 0;
        flex: 1;
        margin: 0;
        color: var(--text-sec);
        font-family: var(--font-mono);
        font-size: 12px;
        line-height: 1.45;
        overflow-wrap: anywhere;
      }

      .divider {
        height: 1px;
        background: var(--divider);
        margin: 14px 0;
      }

      .next-action {
        display: flex;
        gap: 10px;
        padding: 12px 13px;
        border: 1px solid var(--accent-soft-strong);
        border-radius: 9px;
        background: var(--accent-soft);
        color: var(--text);
        font-size: 12.5px;
        line-height: 1.5;
      }

      .command-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .command {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        border: 1px solid var(--code-border);
        border-radius: 7px;
        background: var(--code-bg);
        color: var(--text);
        padding: 8px 10px;
        text-align: left;
      }

      .command code {
        flex: 1;
        min-width: 0;
        color: var(--text);
        font-family: var(--font-mono);
        font-size: 12px;
        line-height: 1.4;
        overflow-wrap: anywhere;
      }

      .copy-state {
        color: var(--text-sec);
        font-family: var(--font-mono);
        font-size: 11px;
        white-space: nowrap;
      }

      .pipeline {
        min-height: 118px;
        height: auto;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        gap: 0;
        padding: 14px 22px;
        background: var(--panel);
        border-top: 1px solid var(--border);
      }

      .pipeline-summary {
        flex-shrink: 0;
        margin-right: 20px;
      }

      .pipeline-status {
        display: flex;
        align-items: center;
        gap: 7px;
        margin-top: 5px;
        color: var(--text);
        font-size: 12.5px;
        font-weight: 550;
      }

      .pipeline-flow {
        flex: 1;
        display: flex;
        align-items: center;
        min-width: 0;
      }

      .step {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        min-width: 74px;
        color: var(--text-sec);
        font-family: var(--font-mono);
        font-size: 10.5px;
        white-space: nowrap;
      }

      .step-icon {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 26px;
        height: 26px;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: var(--panel-alt);
        color: var(--text-tertiary);
      }

      .step.passed .step-icon {
        border-color: transparent;
        background: var(--ok-bg);
        color: var(--ok);
      }

      .step.failed {
        color: var(--error);
      }

      .step.failed .step-icon {
        border-color: transparent;
        background: var(--error-bg);
        color: var(--error);
      }

      .step.blocked {
        opacity: 0.48;
      }

      .connector {
        flex: 1;
        min-width: 12px;
        height: 1.5px;
        margin: 0 6px;
        border-radius: 2px;
        background: var(--border-strong);
      }

      .connector.blocked {
        background: repeating-linear-gradient(90deg, var(--border-strong) 0 4px, transparent 4px 8px);
      }

      .primary-flow {
        flex-shrink: 0;
        margin-left: 22px;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        height: 34px;
        padding: 0 15px;
        border: 0;
        border-radius: 8px;
        background: var(--accent);
        color: #fff;
        font-size: 13px;
        font-weight: 600;
        box-shadow: var(--shadow-sm);
        white-space: nowrap;
      }

      .runner-preview {
        flex-shrink: 0;
        width: min(430px, 34vw);
        margin-left: 22px;
        padding: 12px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--panel-alt);
        box-shadow: var(--shadow-sm);
      }

      .runner-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 9px;
      }

      .runner-title {
        color: var(--text);
        font-size: 12.5px;
        font-weight: 650;
      }

      .runner-project {
        color: var(--text-tertiary);
        font-family: var(--font-mono);
        font-size: 11px;
        white-space: nowrap;
      }

      .runner-steps {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
        margin: 0 0 10px;
        padding: 0;
        list-style: none;
      }

      .runner-steps li {
        padding: 3px 7px;
        border-radius: 999px;
        background: var(--quiet-bg);
        color: var(--quiet);
        font-family: var(--font-mono);
        font-size: 10.5px;
      }

      .runner-actions {
        display: grid;
        gap: 7px;
      }

      .runner-action-button {
        width: 100%;
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 6px 10px;
        align-items: center;
        padding: 8px 10px;
        border: 1px solid var(--accent-soft-strong);
        border-radius: 7px;
        background: var(--panel);
        color: var(--text);
        text-align: left;
      }

      .runner-action-button:disabled {
        cursor: not-allowed;
        opacity: 0.52;
      }

      .runner-action-label {
        min-width: 0;
        font-size: 12.5px;
        font-weight: 600;
      }

      .runner-action-command {
        grid-column: 1 / -1;
        min-width: 0;
        color: var(--text-sec);
        font-family: var(--font-mono);
        font-size: 11px;
        line-height: 1.35;
        overflow-wrap: anywhere;
      }

      .runner-badge {
        color: var(--text-tertiary);
        font-family: var(--font-mono);
        font-size: 10.5px;
        white-space: nowrap;
      }

      .runner-note {
        margin-top: 9px;
        color: var(--text-sec);
        font-size: 11.5px;
        line-height: 1.45;
      }

      .runner-message {
        margin-top: 8px;
        padding: 8px 9px;
        border: 1px solid var(--border);
        border-radius: 7px;
        background: var(--panel);
        color: var(--text-sec);
        font-size: 11.5px;
        line-height: 1.45;
      }

      .runner-message.error {
        border-color: var(--error-bg);
        background: var(--error-bg);
        color: var(--error);
      }

      .runner-result {
        margin-top: 10px;
        display: grid;
        gap: 7px;
      }

      .runner-result-row {
        display: grid;
        grid-template-columns: 80px minmax(0, 1fr);
        gap: 9px;
        color: var(--text-sec);
        font-size: 11.5px;
        line-height: 1.4;
      }

      .runner-result-row strong {
        color: var(--text-tertiary);
        font-family: var(--font-mono);
        font-weight: 600;
      }

      .runner-output {
        max-height: 120px;
        margin: 0;
        padding: 8px 9px;
        border: 1px solid var(--code-border);
        border-radius: 7px;
        background: var(--code-bg);
        color: var(--text);
        font-family: var(--font-mono);
        font-size: 11px;
        line-height: 1.45;
        overflow: auto;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }

      .runner-truncated {
        color: var(--warn);
        font-size: 11px;
      }

      .empty {
        padding: 28px 22px;
        color: var(--text-sec);
        font-size: 13px;
      }

      .icon {
        display: inline-block;
        flex-shrink: 0;
        font-family: var(--font-mono);
        font-size: 12px;
      }

      .mobile-detail-toggle {
        display: none;
      }

      @media (max-width: 1180px) {
        .layout {
          grid-template-columns: 210px minmax(0, 1fr);
        }

        .inspector {
          display: none;
        }

        .mobile-detail-toggle {
          display: inline-flex;
        }
      }

      @media (max-width: 820px) {
        .topbar {
          gap: 10px;
          padding: 0 12px;
        }

        .brand span,
        .crumb,
        .scan,
        .attention {
          display: none;
        }

        .layout {
          display: block;
          overflow: auto;
        }

        .sidebar {
          border-right: 0;
          border-bottom: 1px solid var(--border);
          padding-bottom: 12px;
        }

        .searchbox,
        .folder-help,
        .local-state {
          display: none;
        }

        .nav-group {
          display: flex;
          gap: 8px;
          overflow-x: auto;
          margin-bottom: 12px;
          padding: 0 4px;
        }

        .nav-row {
          flex: 0 0 auto;
          width: auto;
          min-width: 150px;
          max-width: min(72vw, 220px);
          align-items: flex-start;
          border: 1px solid var(--border);
          background: var(--panel);
        }

        .nav-text {
          max-width: min(46vw, 140px);
        }

        .nav-sub {
          max-width: 100%;
        }

        .metrics {
          grid-template-columns: repeat(3, minmax(0, 1fr));
          row-gap: 14px;
        }

        .metric:nth-child(4) {
          padding-left: 0;
          border-left: 0;
        }

        .tabs {
          align-items: flex-start;
          flex-direction: column;
        }

        .tab-meta {
          margin-left: 0;
        }

        .content-grid,
        .learning-grid {
          grid-template-columns: 1fr;
          gap: 4px;
        }

        .row-head {
          display: none;
        }

        .post-row {
          display: block;
          min-height: 0;
          padding: 13px 18px;
        }

        .post-row > * {
          margin: 6px 0;
        }

        .pipeline {
          height: auto;
          align-items: flex-start;
          flex-direction: column;
          gap: 16px;
          padding: 16px 18px;
        }

        .pipeline-flow {
          width: 100%;
          overflow-x: auto;
          padding-bottom: 4px;
        }

        .primary-flow {
          margin-left: 0;
          width: 100%;
          justify-content: center;
        }

        .runner-preview {
          margin-left: 0;
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <span class="traffic" aria-hidden="true"><span></span><span></span><span></span></span>
        <div class="brand">
          <strong>Blog Ops</strong>
          <span>local workspace</span>
        </div>
        <div class="crumb"><span aria-hidden="true">›</span><span id="crumb-label">Content Ops</span></div>
        <div class="topbar-spacer"></div>
        <div class="attention" id="attention">0 need attention</div>
        <div class="scan" id="scan-label">scan -</div>
        <button class="top-button" id="theme-toggle" type="button">Dark</button>
        <button class="top-button" id="refresh" type="button">↻ Refresh</button>
      </header>

      <div class="layout">
        <aside class="sidebar">
          <div class="searchbox">
            <span aria-hidden="true">⌕</span>
            <span>Search posts…</span>
            <span class="kbd">⌘K</span>
          </div>

          <div class="group-label">Folders</div>
          <div class="nav-group" id="projects"></div>
          <div class="folder-help">Folder는 글을 묶고 발행 범위를 고르는 단위입니다.</div>

          <div class="group-label">Smart Views</div>
          <div class="nav-group" id="smart-views"></div>

          <div class="group-label" id="filter-label">Content filters</div>
          <div class="nav-group" id="filters"></div>

          <div class="local-state">
            <div><span style="color: var(--ok)">●</span> working tree local-only</div>
            <div>⎇ <span id="branch-label">read-only inventory</span></div>
            <div>node dashboard · 127.0.0.1</div>
          </div>
        </aside>

        <main class="main">
          <section class="metrics" id="metrics"></section>

          <section class="tabs">
            <div class="tab-list" role="tablist" aria-label="Blog Ops tabs">
              <button class="tab active" data-tab="content" type="button" role="tab" aria-selected="true">Content Ops</button>
              <button class="tab" data-tab="learning" type="button" role="tab" aria-selected="false">Learning Ops</button>
            </div>
            <button class="top-button mobile-detail-toggle" id="mobile-detail" type="button">Selected detail</button>
            <div class="tab-meta" id="tab-meta">0 posts · all folders</div>
          </section>

          <section class="rows" id="rows" aria-live="polite"></section>
        </main>

        <aside class="inspector" id="inspector"></aside>
      </div>

      <section class="pipeline" id="pipeline"></section>
    </div>

    <script>
      const state = {
        inventory: { projects: [], posts: [], warnings: [] },
        activeTab: "content",
        activeProject: "all",
        activeSmartView: "all",
        activeFilter: "all",
        selectedId: null,
        copied: null,
        runnerPreflight: null,
        runnerResult: null,
        runnerRunning: false,
        runnerRunId: 0,
        runnerPreflightError: null,
        runnerRunError: null,
        safeEdit: null,
        safeEditDraft: null,
        safeEditPreview: null,
        safeEditError: "",
        safeEditApplying: false,
        folderCreateDraft: {
          slug: "",
          name: "",
          projectRoot: "",
          description: "",
          stack: "",
          status: "active",
          featured: false,
          repositoryUrl: "",
          demoUrl: "",
        },
        folderCreatePreview: null,
        folderCreateError: "",
        folderDeletePreview: null,
        folderDeleteError: "",
        deleteConfirmation: "",
        removeSourceSetupFolder: false,
        mutationApplying: false,
        theme: localStorage.getItem("blogOpsTheme") || "light",
      };

      document.documentElement.dataset.theme = state.theme;

      const STATUS = {
        published: ["published", "ok"],
        draft: ["draft", "quiet"],
        "pending-sync": ["pending-sync", "info"],
        "orphan-published": ["orphan-published", "warn"],
        unknown: ["unknown", "unknown"],
        "archived-note": ["archived-note", "quiet"],
        "not-started": ["not-started", "quiet"],
        "questions-ready": ["questions-ready", "info"],
        "first-answer-written": ["first-answer", "warn"],
        reviewed: ["reviewed", "info"],
        "needs-revisit": ["needs-revisit", "warn"],
        "interview-ready": ["interview-ready", "ok"],
        invalid: ["invalid", "error"],
        "frontmatter-error": ["frontmatter-error", "error"],
        "invalid-tags": ["invalid-tags", "error"],
        "source-stale": ["source-stale", "warn"],
        "questions-stale": ["questions-stale", "warn"],
        "review-due": ["review-due", "warn"],
        "private-note-not-ignored": ["private-note-not-ignored", "error"],
        "local-progress-not-ignored": ["local-progress-not-ignored", "error"],
      };

      const FILTERS = {
        content: [
          ["all", "All content", null],
          ["warnings", "Needs attention", "error"],
          ["pending-sync", "Pending sync", "info"],
          ["orphan-published", "Orphan published", "warn"],
          ["draft", "Drafts", "quiet"],
          ["unknown", "Unknown", "unknown"],
        ],
        learning: [
          ["all", "All learning", null],
          ["not-started", "Not started", "quiet"],
          ["questions-ready", "Questions ready", "info"],
          ["needs-revisit", "Needs revisit", "warn"],
          ["interview-ready", "Interview ready", "ok"],
        ],
      };

      const SMART_VIEWS = [
        {
          key: "all",
          label: "All Writing",
          tone: null,
          matches: () => true,
        },
        {
          key: "dev-log",
          label: "Dev Logs",
          tone: "info",
          matches: (post) => post.type === "dev-log",
        },
        {
          key: "deep-dive",
          label: "Deep Dives",
          tone: "info",
          matches: (post) => post.type === "deep-dive",
        },
        {
          key: "needs-attention",
          label: "Needs Attention",
          tone: "error",
          matches: (post) => hasAttention(post),
        },
        {
          key: "learning-queue",
          label: "Learning Queue",
          tone: "warn",
          matches: (post) =>
            ["not-started", "questions-ready", "needs-revisit", "first-answer-written"].includes(post.learningStatus),
        },
      ];

      function escapeHtml(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#39;");
      }

      function escapeAttribute(value) {
        return escapeHtml(value).replaceAll('"', "&quot;");
      }

      function summaryLengthStatus(summary) {
        const count = String(summary || "").length;
        if (count === 0) {
          return {
            status: "error",
            label: "0 / 160 recommended",
            message: "summary는 비어 있을 수 없습니다.",
          };
        }
        if (count < 80) {
          return {
            status: "warning",
            label: count + " / 160 recommended",
            message: "조금 짧습니다. 문제, 결정, 결과가 드러나도록 80자 이상을 권장합니다.",
          };
        }
        if (count <= 160) {
          return {
            status: "good",
            label: count + " / 160 recommended",
            message: "권장 길이 안에 있습니다.",
          };
        }
        if (count <= 220) {
          return {
            status: "warning",
            label: count + " / 160 recommended",
            message: "조금 깁니다. 목록과 공유 카드에서 잘릴 수 있습니다.",
          };
        }
        return {
          status: "error",
          label: count + " / 220 max",
          message: "summary가 너무 깁니다. 220자 이하로 줄이세요.",
        };
      }

      function renderTagOptions(allowedTags, selectedTags) {
        const selected = new Set(selectedTags || []);
        const tags = allowedTags || [];
        if (!tags.length) return "<p class=\"muted\">허용된 tag 정책을 불러오지 못했습니다.</p>";
        return tags
          .map((tag) => {
            const checked = selected.has(tag) ? " checked" : "";
            return "<label class=\"tag-option\"><input type=\"checkbox\" data-safe-edit-tag=\"" + escapeAttribute(tag) + "\"" + checked + "> " + escapeHtml(tag) + "</label>";
          })
          .join("");
      }

      function cssTone(tone) {
        if (!tone) return "";
        return "style=\"--status-fg: var(--" + tone + "); --status-bg: var(--" + tone + "-bg)\"";
      }

      function statusInfo(status) {
        const item = STATUS[status] || [status || "unknown", "unknown"];
        return { label: item[0], tone: item[1] };
      }

      function statusDot(status) {
        const info = statusInfo(status);
        return "<span class=\"status-dot\" " + cssTone(info.tone) + ">" + escapeHtml(info.label) + "</span>";
      }

      function chip(status) {
        const info = statusInfo(status);
        return "<span class=\"chip\" " + cssTone(info.tone) + ">" + escapeHtml(info.label) + "</span>";
      }

      function warningPill(value) {
        const code = typeof value === "string" ? value : value?.code || "warning";
        const info = statusInfo(code);
        return "<span class=\"warn-pill\" " + cssTone(info.tone === "unknown" ? "warn" : info.tone) + ">⚠ " + escapeHtml(info.label) + "</span>";
      }

      function formatShortDate(value) {
        if (!value) return "-";
        const match = String(value).match(/\\d{4}-(\\d{2})-(\\d{2})/);
        return match ? match[1] + "-" + match[2] : String(value);
      }

      function projectName(slug) {
        return state.inventory.projects.find((project) => project.slug === slug)?.name || slug || "-";
      }

      function allPosts() {
        return state.inventory.posts || [];
      }

      function folderStats(slug) {
        const posts = slug === "all" ? allPosts() : allPosts().filter((post) => post.project === slug);
        return {
          total: posts.length,
          drafts: posts.filter((post) => post.publishStatus === "draft").length,
          pending: posts.filter((post) => post.publishStatus === "pending-sync").length,
        };
      }

      function folderSubLabel(stats) {
        const postLabel = stats.total === 1 ? "post" : "posts";
        const parts = [stats.total + " " + postLabel];
        if (stats.drafts > 0) parts.push(stats.drafts + " " + (stats.drafts === 1 ? "draft" : "drafts"));
        if (stats.pending > 0) parts.push(stats.pending + " pending");
        return parts.join(" · ");
      }

      function hasAttention(post) {
        return (post.warnings || []).length > 0 || post.tagStatus === "invalid" || (post.quickFixSuggestions || []).length > 0;
      }

      function smartViewDefinition(key) {
        return SMART_VIEWS.find((view) => view.key === key) || SMART_VIEWS.find((view) => view.key === "all");
      }

      function smartViewMatches(post, key) {
        return smartViewDefinition(key).matches(post);
      }

      function folderScopedPosts() {
        return allPosts().filter((post) => {
          return state.activeProject === "all" || post.project === state.activeProject;
        });
      }

      function countForSmartView(key) {
        return folderScopedPosts().filter((post) => smartViewMatches(post, key)).length;
      }

      function baseFilteredPosts() {
        return folderScopedPosts().filter((post) => smartViewMatches(post, state.activeSmartView));
      }

      function filteredPosts() {
        return baseFilteredPosts().filter((post) => {
          if (state.activeFilter === "all") return true;
          if (state.activeTab === "content") {
            if (state.activeFilter === "warnings") return hasAttention(post);
            return post.publishStatus === state.activeFilter;
          }
          return post.learningStatus === state.activeFilter;
        });
      }

      function currentPosts() {
        const posts = filteredPosts();
        return state.activeTab === "content" ? sortContent(posts) : sortLearning(posts);
      }

      function countForFilter(key) {
        const posts = baseFilteredPosts();
        if (key === "all") return posts.length;
        if (state.activeTab === "content") {
          if (key === "warnings") return posts.filter(hasAttention).length;
          return posts.filter((post) => post.publishStatus === key).length;
        }
        return posts.filter((post) => post.learningStatus === key).length;
      }

      function sortContent(posts) {
        const rank = { unknown: 1, "orphan-published": 2, "pending-sync": 3, draft: 4, published: 5, "archived-note": 6 };
        return [...posts].sort((a, b) => {
          const attentionRank = Number(hasAttention(b)) - Number(hasAttention(a));
          if (attentionRank !== 0) return attentionRank;
          return (rank[a.publishStatus] || 9) - (rank[b.publishStatus] || 9) || a.id.localeCompare(b.id);
        });
      }

      function sortLearning(posts) {
        const rank = {
          "needs-revisit": 1,
          "questions-ready": 2,
          "first-answer-written": 3,
          reviewed: 4,
          "not-started": 5,
          "interview-ready": 6,
        };
        return [...posts]
          .filter((post) => post.publishStatus !== "archived-note")
          .sort((a, b) => (rank[a.learningStatus] || 9) - (rank[b.learningStatus] || 9) || a.id.localeCompare(b.id));
      }

      function selectedPost() {
        const visiblePosts = currentPosts();
        return visiblePosts.find((post) => post.id === state.selectedId) || visiblePosts[0] || null;
      }

      function warningCodes(post) {
        const codes = [...(post.warnings || []).map((warning) => warning.code || warning)];
        if (post.tagStatus === "invalid") codes.push("invalid-tags");
        return [...new Set(codes)];
      }

      function nextAction(post) {
        if (!post) return "선택한 글이 없습니다.";
        if (post.publishStatus === "unknown") return "frontmatter를 먼저 복구하거나 source exclude 여부를 결정하세요.";
        if (post.publishStatus === "orphan-published") return "source 복구, 발행본 제거, archive 처리 중 하나를 선택하세요.";
        if (post.publishStatus === "pending-sync") return "source validation 후 sync와 published validation을 실행하세요.";
        if (post.publishStatus === "draft") return "계속 작성하거나 draft 해제 전 validation을 실행하세요.";
        if (post.learningStatus === "needs-revisit") return "질문 세트나 원문이 바뀐 글입니다. 개인 답변 노트를 다시 확인하세요.";
        if (post.learningStatus === "questions-ready") return "면접 질문 세트가 준비되어 있습니다. 첫 답변을 작성하세요.";
        if (!post.hasPrivateNote && post.hasQuestions) return "개인 답변 노트가 없습니다. 공개 글의 질문 세트로 복습을 시작하세요.";
        return "source를 수정한 뒤 validate/sync를 실행하세요.";
      }

      function commandSuggestions(post) {
        if (!post) return [];
        const commands = [];
        if (post.sourcePath) {
          commands.push("npm run validate:posts -- --source --project " + post.project);
        }
        if (post.publishStatus === "pending-sync") {
          commands.push("npm run sync:posts -- --project " + post.project);
          commands.push("npm run validate:posts");
        }
        if (post.publishStatus === "published" || post.publishStatus === "orphan-published") {
          commands.push("npm run validate:posts");
        }
        if (post.publishStatus !== "unknown") {
          commands.push("npm test");
          commands.push("npm run build");
        }
        if (post.agentPrompt) {
          commands.push("Copy learning agent prompt");
        }
        return [...new Set(commands)].slice(0, 5);
      }

      function renderProjects() {
        const items = [["all", "All Folders"]].concat(
          state.inventory.projects.map((project) => [project.slug, project.name]),
        );
        document.querySelector("#projects").innerHTML = items
          .map(([slug, name]) => {
            const stats = folderStats(slug);
            const active = state.activeProject === slug ? " active" : "";
            return "<button class=\"nav-row" + active + "\" data-project=\"" + escapeHtml(slug) + "\" type=\"button\" title=\"" + escapeHtml(folderSubLabel(stats)) + "\">" +
              "<span class=\"icon\">" + (slug === "all" ? "▣" : "□") + "</span>" +
              "<span class=\"nav-text\"><span class=\"nav-name\">" + escapeHtml(name) + "</span><span class=\"nav-sub\">" + escapeHtml(folderSubLabel(stats)) + "</span></span>" +
              "<span class=\"count\">" + stats.total + "</span>" +
            "</button>";
          })
          .join("");
      }

      function renderSmartViews() {
        document.querySelector("#smart-views").innerHTML = SMART_VIEWS
          .map((view) => {
            const active = state.activeSmartView === view.key ? " active" : "";
            const dot = view.tone ? "<span class=\"icon\" style=\"color: var(--" + view.tone + ")\">●</span>" : "<span class=\"icon\">•</span>";
            return "<button class=\"nav-row" + active + "\" data-smart-view=\"" + escapeHtml(view.key) + "\" type=\"button\">" +
              dot +
              "<span class=\"nav-name\">" + escapeHtml(view.label) + "</span>" +
              "<span class=\"count\">" + countForSmartView(view.key) + "</span>" +
            "</button>";
          })
          .join("");
      }

      function renderFilters() {
        document.querySelector("#filter-label").textContent = state.activeTab === "content" ? "Content filters" : "Learning filters";
        document.querySelector("#filters").innerHTML = FILTERS[state.activeTab]
          .map(([key, label, tone]) => {
            const active = state.activeFilter === key ? " active" : "";
            const dot = tone ? "<span class=\"icon\" style=\"color: var(--" + tone + ")\">●</span>" : "<span class=\"icon\">•</span>";
            return "<button class=\"nav-row" + active + "\" data-filter=\"" + escapeHtml(key) + "\" type=\"button\">" + dot + "<span class=\"nav-name\">" + escapeHtml(label) + "</span><span class=\"count\">" + countForFilter(key) + "</span></button>";
          })
          .join("");
      }

      function renderMetrics() {
        const posts = baseFilteredPosts();
        const metrics = [
          ["Posts", posts.length, false],
          ["Published", posts.filter((post) => post.publishStatus === "published").length, false],
          ["Orphan", posts.filter((post) => post.publishStatus === "orphan-published").length, false],
          ["Attention", posts.filter(hasAttention).length, true],
          ["Pending Sync", posts.filter((post) => post.publishStatus === "pending-sync").length, false],
          ["Learning Ready", posts.filter((post) => post.learningStatus === "questions-ready").length, false],
        ];
        document.querySelector("#metrics").innerHTML = metrics
          .map(([label, value, attention]) => {
            return "<div class=\"metric" + (attention ? " attention-metric" : "") + "\"><strong>" + value + "</strong><span>" + escapeHtml(label) + "</span></div>";
          })
          .join("");
      }

      function tickPair(post) {
        return "<span class=\"tick-pair\"><span>src " + (post.sourcePath ? "✓" : "×") + "</span><span class=\"" + (post.publishedPath ? "" : "missing") + "\">pub " + (post.publishedPath ? "✓" : "-") + "</span></span>";
      }

      function renderRows() {
        const posts = currentPosts();
        const selected = selectedPost();
        document.querySelector("#tab-meta").textContent =
          posts.length + " posts · " + (state.activeProject === "all" ? "all folders" : state.activeProject);

        if (posts.length === 0) {
          document.querySelector("#rows").innerHTML = "<div class=\"empty\">조건에 맞는 글이 없습니다.</div>";
          return;
        }

        if (state.activeTab === "content") {
          const head =
            "<div class=\"row-head content-grid\"><div>Status</div><div>Title</div><div>Folder</div><div>Source · Pub</div><div>Warnings</div></div>";
          const rows = posts
            .map((post) => {
              const selectedClass = selected && selected.id === post.id ? " selected" : "";
              const warnings = warningCodes(post);
              return "<button class=\"post-row content-grid" + selectedClass + "\" data-post=\"" + escapeHtml(post.id) + "\" type=\"button\">" +
                "<div>" + statusDot(post.publishStatus) + "</div>" +
                "<div class=\"title-cell\">" + escapeHtml(post.title) + "</div>" +
                "<div class=\"small-cell\">" + escapeHtml(projectName(post.project)) + "</div>" +
                "<div>" + tickPair(post) + "</div>" +
                "<div class=\"warning-list\">" + (warnings.length ? warnings.map(warningPill).join("") : "<span class=\"mono-cell\">-</span>") + "</div>" +
                "</button>";
            })
            .join("");
          document.querySelector("#rows").innerHTML = head + rows;
          return;
        }

        const head =
          "<div class=\"row-head learning-grid\"><div>Learning</div><div>Title</div><div>Folder</div><div>Private note</div><div>Next Review</div></div>";
        const rows = posts
          .map((post) => {
            const selectedClass = selected && selected.id === post.id ? " selected" : "";
            const note = post.privateNotePath ? "🔒 " + post.privateNotePath : "— none";
            return "<button class=\"post-row learning-grid" + selectedClass + "\" data-post=\"" + escapeHtml(post.id) + "\" type=\"button\">" +
              "<div>" + statusDot(post.learningStatus) + "</div>" +
              "<div class=\"title-cell\">" + escapeHtml(post.title) + "</div>" +
              "<div class=\"small-cell\">" + escapeHtml(projectName(post.project)) + "</div>" +
              "<div class=\"mono-cell\">" + escapeHtml(note) + "</div>" +
              "<div class=\"mono-cell\">" + escapeHtml(post.nextReviewAt || "-") + "</div>" +
              "</button>";
          })
          .join("");
        document.querySelector("#rows").innerHTML = head + rows;
      }

      function metaRow(label, value) {
        return "<div class=\"meta-row\"><dt>" + escapeHtml(label) + "</dt><dd>" + value + "</dd></div>";
      }

      function postSlug(post) {
        if (post?.slug) return post.slug;
        const id = String(post?.id || "");
        const slashIndex = id.lastIndexOf("/");
        return slashIndex >= 0 ? id.slice(slashIndex + 1) : id;
      }

      function editableDraft(editable = {}) {
        return {
          title: editable.title ?? "",
          summary: editable.summary ?? "",
          type: editable.type ?? "",
          tags: Array.isArray(editable.tags) ? [...editable.tags] : [],
          draft: editable.draft,
          featured: editable.featured,
        };
      }

      function valuesEqual(left, right) {
        return JSON.stringify(left) === JSON.stringify(right);
      }

      function safeEditChanges() {
        const current = state.safeEdit?.editable || {};
        const draft = state.safeEditDraft || {};
        const changes = {};
        for (const field of ["title", "summary", "type", "tags", "draft", "featured"]) {
          if (!valuesEqual(current[field], draft[field])) changes[field] = draft[field];
        }
        return changes;
      }

      function folderCreateInput() {
        const draft = state.folderCreateDraft;
        return {
          slug: draft.slug,
          name: draft.name,
          projectRoot: draft.projectRoot,
          description: draft.description,
          stack: String(draft.stack || "")
            .split(",")
            .map((item) => item.trim())
            .filter(Boolean),
          status: draft.status || "active",
          featured: draft.featured === true,
          repositoryUrl: draft.repositoryUrl,
          demoUrl: draft.demoUrl,
        };
      }

      function formatMutationValue(value) {
        if (value === undefined) return "unset";
        if (typeof value === "string") return value || "empty";
        return JSON.stringify(value);
      }

      function mutationIssueLine(issue) {
        const code = issue?.code ? "<code>" + escapeHtml(issue.code) + "</code> " : "";
        const field = issue?.field ? "<code>" + escapeHtml(issue.field) + "</code> " : "";
        const message = escapeHtml(issue?.message || issue?.detail || issue || "Unknown issue.");
        const nextAction = issue?.nextAction ? "<br><span>nextAction: " + escapeHtml(issue.nextAction) + "</span>" : "";
        const suggestions = issue?.suggestions?.length
          ? "<br><span>suggestions: " + issue.suggestions.map((suggestion) => escapeHtml(suggestion.suggestion || suggestion.tag || suggestion)).join(", ") + "</span>"
          : "";
        return "<li>" + code + field + message + nextAction + suggestions + "</li>";
      }

      function renderMutationIssues(title, issues, tone = "error") {
        if (!issues?.length) return "";
        return "<div class=\"mutation-message " + tone + "\"><strong>" + escapeHtml(title) + "</strong><ul class=\"mutation-list\">" + issues.map(mutationIssueLine).join("") + "</ul></div>";
      }

      function renderOperations(operations = []) {
        if (!operations.length) return "";
        return "<div class=\"mutation-message\"><strong>Planned file changes</strong><ul class=\"mutation-list\">" +
          operations
            .map((operation) => {
              const type = operation.type || operation.operation || "change";
              const path = operation.path || operation.target || "-";
              return "<li><code>" + escapeHtml(type) + "</code> " + escapeHtml(path) + "</li>";
            })
            .join("") +
          "</ul></div>";
      }

      function renderFilePreviews(files = []) {
        if (!files.length) return "";
        return "<div class=\"mutation-message\"><strong>Preview files</strong><ul class=\"mutation-list\">" +
          files
            .map((file) => {
              const changed = file.changed === false ? "unchanged" : file.operation || "modify";
              const hash = file.beforeHash && file.afterHash ? " · " + file.beforeHash + " → " + file.afterHash : "";
              return "<li><code>" + escapeHtml(changed) + "</code> " + escapeHtml(file.path || file.absolutePath || "-") + escapeHtml(hash) + "</li>";
            })
            .join("") +
          "</ul></div>";
      }

      function renderChangedFields(fields = []) {
        if (!fields.length) {
          return "<div class=\"mutation-message warning\">변경된 frontmatter field가 없습니다.</div>";
        }
        return "<div class=\"mutation-message\"><strong>Changed fields</strong><ul class=\"mutation-list\">" +
          fields
            .map((field) => {
              return "<li><code>" + escapeHtml(field.field) + "</code> " + escapeHtml(formatMutationValue(field.before)) + " → " + escapeHtml(formatMutationValue(field.after)) + "</li>";
            })
            .join("") +
          "</ul></div>";
      }

      function renderSafeEditPreview() {
        const error = state.safeEditError ? "<div class=\"mutation-message error\">" + escapeHtml(state.safeEditError) + "</div>" : "";
        const preview = state.safeEditPreview;
        if (!preview) return error;
        const status = preview.canApply
          ? "<div class=\"mutation-message good\">Preview ready. Apply changes is enabled for this source hash.</div>"
          : "<div class=\"mutation-message error\">Preview blocked. Resolve errors before applying.</div>";
        const nextAction = preview.nextAction ? "<div class=\"mutation-message\"><strong>nextAction</strong><br>" + escapeHtml(preview.nextAction) + "</div>" : "";
        return "<div class=\"mutation-preview\" data-safe-edit-preview-output>" +
          error +
          status +
          renderMutationIssues("Errors", preview.errors, "error") +
          renderMutationIssues("Warnings", preview.warnings, "warning") +
          renderChangedFields(preview.changedFields || []) +
          renderFilePreviews(preview.files || []) +
          nextAction +
        "</div>";
      }

      function renderSafeEditPanel(post) {
        const slug = postSlug(post);
        const loaded = state.safeEdit && state.safeEdit.project === post.project && state.safeEdit.slug === slug;
        const error = state.safeEditError ? "<div class=\"mutation-message error\">" + escapeHtml(state.safeEditError) + "</div>" : "";

        if (!post?.sourcePath) {
          return "<section class=\"mutation-section safe-edit-panel\"><h2>Safe Edit</h2><p class=\"muted\">source post가 있는 글만 수정 가능.</p>" + error + "</section>";
        }

        if (!loaded) {
          return "<section class=\"mutation-section safe-edit-panel\"><h2>Safe Edit</h2>" +
            "<button class=\"button\" data-safe-edit-open type=\"button\">Edit frontmatter</button>" +
            "<p class=\"muted\">발행본은 직접 수정하지 않습니다. source post만 preview 후 apply합니다.</p>" +
            error +
          "</section>";
        }

        const draft = state.safeEditDraft || editableDraft(state.safeEdit.editable);
        const summaryState = summaryLengthStatus(draft.summary);
        const allowedTypes = state.safeEdit.allowedTypes?.length ? state.safeEdit.allowedTypes : [draft.type].filter(Boolean);
        const typeOptions = allowedTypes
          .map((type) => "<option value=\"" + escapeAttribute(type) + "\"" + (draft.type === type ? " selected" : "") + ">" + escapeHtml(type) + "</option>")
          .join("");
        const canApply = Boolean(state.safeEditPreview?.canApply) && !state.safeEditApplying && !state.mutationApplying;

        return "<section class=\"mutation-section safe-edit-panel\">" +
          "<h2>Safe Edit</h2>" +
          "<div class=\"readonly-grid\">" +
            "<span>Folder</span><strong>" + escapeHtml(state.safeEdit.project) + "</strong>" +
            "<span>Slug</span><strong>" + escapeHtml(state.safeEdit.slug) + "</strong>" +
            "<span>Source</span><strong>" + escapeHtml(state.safeEdit.sourcePath || post.sourcePath) + "</strong>" +
          "</div>" +
          "<div class=\"mutation-fields\">" +
            "<label>Title<input type=\"text\" data-safe-edit-field=\"title\" value=\"" + escapeAttribute(draft.title || "") + "\"></label>" +
            "<label>Summary<input type=\"text\" data-safe-edit-field=\"summary\" value=\"" + escapeAttribute(draft.summary || "") + "\"></label>" +
            "<div class=\"summary-count " + summaryState.status + "\" data-summary-count><strong>summaryCount</strong> " + escapeHtml(summaryState.label) + " · " + escapeHtml(summaryState.message) + "</div>" +
            "<label>Type<select data-safe-edit-field=\"type\">" + typeOptions + "</select></label>" +
            "<div class=\"mutation-label\"><span>Tags</span><div class=\"tag-picker\">" + renderTagOptions(state.safeEdit.allowedTags, draft.tags) + "</div></div>" +
            "<p class=\"muted\">Tag policy update required: 새 tag가 필요하면 tag 정책을 먼저 갱신하세요.</p>" +
            "<label class=\"mutation-check\"><input type=\"checkbox\" data-safe-edit-field=\"draft\"" + (draft.draft === true ? " checked" : "") + "> Draft</label>" +
            "<label class=\"mutation-check\"><input type=\"checkbox\" data-safe-edit-field=\"featured\"" + (draft.featured === true ? " checked" : "") + "> Featured</label>" +
          "</div>" +
          "<div class=\"button-row\">" +
            "<button class=\"button\" data-safe-edit-preview type=\"button\"" + (state.safeEditApplying ? " disabled" : "") + ">Preview changes</button>" +
            "<button class=\"button primary\" data-safe-edit-apply type=\"button\"" + (canApply ? "" : " disabled") + ">" + (state.safeEditApplying ? "Applying..." : "Apply changes") + "</button>" +
          "</div>" +
          renderSafeEditPreview() +
        "</section>";
      }

      function renderFolderCreatePreview() {
        const error = state.folderCreateError ? "<div class=\"mutation-message error\">" + escapeHtml(state.folderCreateError) + "</div>" : "";
        const preview = state.folderCreatePreview;
        if (!preview) return error;
        const status = preview.canApply
          ? "<div class=\"mutation-message good\">Folder preview ready. Metadata hash captured for apply.</div>"
          : "<div class=\"mutation-message error\">Folder changes are blocked. Resolve blockers before applying.</div>";
        return "<div class=\"mutation-preview\" data-folder-create-preview-output>" +
          error +
          status +
          renderMutationIssues("Folder changes are blocked", preview.blockers, "error") +
          renderOperations(preview.operations || []) +
          renderFilePreviews(preview.filePreviews || []) +
        "</div>";
      }

      function renderDeleteReadiness(readiness = []) {
        if (!readiness.length) {
          return "<div class=\"mutation-message\"><strong>Delete readiness</strong><p class=\"muted\">Preview delete를 실행하면 delete readiness checklist가 표시됩니다.</p></div>";
        }
        return "<div class=\"mutation-message\"><strong>Delete readiness</strong><ul class=\"readiness-list\">" +
          readiness
            .map((item) => {
              const status = item.status || "blocked";
              return "<li class=\"" + escapeAttribute(status) + "\"><span><code>" + escapeHtml(status) + "</code> " + escapeHtml(item.label || item.code || "readiness") + "</span><span>" + escapeHtml(item.detail || "") + "</span><span>nextAction: " + escapeHtml(item.nextAction || "-") + "</span></li>";
            })
            .join("") +
          "</ul></div>";
      }

      function renderFolderDeletePreview() {
        const error = state.folderDeleteError ? "<div class=\"mutation-message error\">" + escapeHtml(state.folderDeleteError) + "</div>" : "";
        const preview = state.folderDeletePreview;
        if (!preview) return error + renderDeleteReadiness([]);
        const status = preview.canApply
          ? "<div class=\"mutation-message good\">Delete preview ready. Confirmation is still required before apply.</div>"
          : "<div class=\"mutation-message error\">Folder changes are blocked. Resolve delete blockers before applying.</div>";
        return "<div class=\"mutation-preview\" data-folder-delete-preview-output>" +
          error +
          status +
          renderDeleteReadiness(preview.readiness || []) +
          renderMutationIssues("Folder changes are blocked", preview.blockers, "error") +
          renderOperations(preview.operations || []) +
          renderFilePreviews(preview.filePreviews || []) +
        "</div>";
      }

      function renderFolderDeletePanel() {
        if (state.activeProject === "all") {
          return "<p class=\"muted\">All Folders에서는 삭제할 수 없습니다. 단일 Folder를 선택하세요.</p>" +
            "<div class=\"button-row\">" +
              "<button class=\"button\" data-folder-delete-preview type=\"button\" disabled>Preview delete</button>" +
              "<button class=\"button primary\" data-folder-delete-apply type=\"button\" disabled>Apply delete</button>" +
            "</div>";
        }

        const requiredConfirmation = "delete " + state.activeProject;
        const canApply = Boolean(state.folderDeletePreview?.canApply) && state.deleteConfirmation === requiredConfirmation && !state.mutationApplying;
        return "<p class=\"muted\">Current Folder: <code>" + escapeHtml(state.activeProject) + "</code></p>" +
          "<label class=\"mutation-check\"><input type=\"checkbox\" data-folder-delete-remove-setup" + (state.removeSourceSetupFolder ? " checked" : "") + "> Remove empty source setup folder</label>" +
          renderFolderDeletePreview() +
          "<label class=\"mutation-label\" style=\"margin-top: 10px\">Confirmation<input class=\"confirmation-input\" type=\"text\" data-folder-delete-confirmation value=\"" + escapeAttribute(state.deleteConfirmation) + "\" placeholder=\"" + escapeAttribute(requiredConfirmation) + "\"></label>" +
          "<p class=\"muted\">deleteConfirmation must exactly match <code>" + escapeHtml(requiredConfirmation) + "</code>.</p>" +
          "<div class=\"button-row\">" +
            "<button class=\"button\" data-folder-delete-preview type=\"button\"" + (state.mutationApplying ? " disabled" : "") + ">Preview delete</button>" +
            "<button class=\"button primary\" data-folder-delete-apply type=\"button\"" + (canApply ? "" : " disabled") + ">" + (state.mutationApplying ? "Applying..." : "Apply delete") + "</button>" +
          "</div>";
      }

      function renderFolderManagementPanel() {
        const draft = state.folderCreateDraft;
        const canCreateApply = Boolean(state.folderCreatePreview?.canApply) && !state.mutationApplying;
        return "<section class=\"mutation-section folder-management\">" +
          "<h2>Folder Management</h2>" +
          "<p class=\"muted\">Folder changes are blocked when metadata or readiness checks report blockers.</p>" +
          "<details>" +
            "<summary>New Folder</summary>" +
            "<div class=\"mutation-fields\">" +
              "<label>Slug<input type=\"text\" data-folder-create-field=\"slug\" value=\"" + escapeAttribute(draft.slug) + "\"></label>" +
              "<label>Name<input type=\"text\" data-folder-create-field=\"name\" value=\"" + escapeAttribute(draft.name) + "\"></label>" +
              "<label>Project root<input type=\"text\" data-folder-create-field=\"projectRoot\" value=\"" + escapeAttribute(draft.projectRoot) + "\"></label>" +
              "<label>Description<input type=\"text\" data-folder-create-field=\"description\" value=\"" + escapeAttribute(draft.description) + "\"></label>" +
              "<label>Stack<input type=\"text\" data-folder-create-field=\"stack\" value=\"" + escapeAttribute(draft.stack) + "\" placeholder=\"Astro, TypeScript\"></label>" +
              "<label>Status<select data-folder-create-field=\"status\">" +
                "<option value=\"active\"" + (draft.status === "active" ? " selected" : "") + ">active</option>" +
                "<option value=\"archived\"" + (draft.status === "archived" ? " selected" : "") + ">archived</option>" +
              "</select></label>" +
              "<label class=\"mutation-check\"><input type=\"checkbox\" data-folder-create-field=\"featured\"" + (draft.featured ? " checked" : "") + "> Featured</label>" +
              "<label>Repository URL<input type=\"url\" data-folder-create-field=\"repositoryUrl\" value=\"" + escapeAttribute(draft.repositoryUrl) + "\"></label>" +
              "<label>Demo URL<input type=\"url\" data-folder-create-field=\"demoUrl\" value=\"" + escapeAttribute(draft.demoUrl) + "\"></label>" +
            "</div>" +
            "<div class=\"button-row\">" +
              "<button class=\"button\" data-folder-create-preview type=\"button\"" + (state.mutationApplying ? " disabled" : "") + ">Preview Folder</button>" +
              "<button class=\"button primary\" data-folder-create-apply type=\"button\"" + (canCreateApply ? "" : " disabled") + ">Apply Folder</button>" +
            "</div>" +
            renderFolderCreatePreview() +
          "</details>" +
          "<details>" +
            "<summary>Delete Empty Folder</summary>" +
            renderFolderDeletePanel() +
          "</details>" +
        "</section>";
      }

      function renderInspector() {
        const post = selectedPost();
        if (!post) {
          document.querySelector("#inspector").innerHTML =
            "<div class=\"inspector-head\"><div class=\"inspector-title-row\"><span class=\"eyebrow\">Folder tools</span></div><h2>Blog Ops</h2></div>" +
            "<div class=\"inspector-body\"><p class=\"muted\">선택한 글이 없습니다.</p>" + renderFolderManagementPanel() + "</div>";
          return;
        }
        const warnings = warningCodes(post);
        const learningWarnings = post.learningWarnings || [];
        const commands = commandSuggestions(post);
        document.querySelector("#inspector").innerHTML =
          "<div class=\"inspector-head\">" +
            "<div class=\"inspector-title-row\"><span class=\"eyebrow\">Post detail</span>" + chip(post.publishStatus) + "</div>" +
            "<h2>" + escapeHtml(post.title) + "</h2>" +
            "<div class=\"inspector-sub\"><span>" + escapeHtml(projectName(post.project)) + "</span><span>·</span><code>updated " + escapeHtml(formatShortDate(post.date)) + "</code></div>" +
          "</div>" +
          "<div class=\"inspector-body\">" +
            "<p class=\"section-title\">Paths</p>" +
            "<dl>" +
              metaRow("source", post.sourcePath ? escapeHtml(post.sourcePath) : "<span style=\"color: var(--error)\">missing</span>") +
              metaRow("published", post.publishedPath ? escapeHtml(post.publishedPath) : "<span style=\"color: var(--text-tertiary)\">- not published</span>") +
              metaRow("note", post.privateNotePath ? "🔒 " + escapeHtml(post.privateNotePath) + "<br><span style=\"font-family: var(--font-sans); color: var(--text-tertiary); font-size: 11px\">내용은 표시되지 않습니다 · 존재/경로/상태만</span>" : "<span style=\"color: var(--text-tertiary)\">none</span>") +
            "</dl>" +
            "<div class=\"divider\"></div>" +
            "<p class=\"section-title\">Status</p>" +
            "<div class=\"tag-list\">" + chip(post.publishStatus) + chip(post.learningStatus) + chip(post.tagStatus || "valid") + "</div>" +
            "<div class=\"divider\"></div>" +
            "<p class=\"section-title\">Warnings</p>" +
            "<div class=\"command-list\">" + (warnings.length ? warnings.map(warningPill).join("") : "<span class=\"mono-cell\">No content warnings</span>") + "</div>" +
            "<div class=\"divider\"></div>" +
            "<p class=\"section-title\">Learning Warnings</p>" +
            "<div class=\"command-list\">" + (learningWarnings.length ? learningWarnings.map(warningPill).join("") : "<span class=\"mono-cell\">No learning warnings · learningStatusSource: " + escapeHtml(post.learningStatusSource || "fallback") + "</span>") + "</div>" +
            "<div class=\"divider\"></div>" +
            "<p class=\"section-title\">Suggested next action</p>" +
            "<div class=\"next-action\"><span style=\"color: var(--accent)\">→</span><span>" + escapeHtml(nextAction(post)) + "</span></div>" +
            "<div class=\"divider\"></div>" +
            "<p class=\"section-title\">Command suggestions</p>" +
            "<div class=\"command-list\">" + (commands.length ? commands.map((command) => renderCommand(command, post)).join("") : "<span class=\"mono-cell\">조치 불필요 — 준비 완료</span>") + "</div>" +
            renderSafeEditPanel(post) +
            renderFolderManagementPanel() +
          "</div>";
      }

      function renderCommand(command, post) {
        const isLearningPrompt = command === "Copy learning agent prompt";
        const isRunnerCopy = command === "Copy dry-run" || command === "Copy publish";
        const isExplicitCopy = isLearningPrompt || isRunnerCopy;
        const copyValue = isExplicitCopy ? post.agentPrompt || "" : command;
        const displayValue = isRunnerCopy ? copyValue : command;
        const copied = state.copied === command;
        return "<button class=\"command\" data-copy=\"" + escapeHtml(copyValue) + "\" data-copy-label=\"" + escapeHtml(command) + "\" type=\"button\"><span class=\"copy-state\">" + (copied ? "✓" : "$") + "</span><code>" + escapeHtml(displayValue) + "</code><span class=\"copy-state\">" + (copied ? "copied" : "copy") + "</span></button>";
      }

      function activePublishProjectSlug() {
        if (state.activeProject === "all") return "";
        return state.activeProject;
      }

      function publishPreviewCommands() {
        const project = activePublishProjectSlug();
        if (!project) {
          return {
            project: "",
            dryRun: "",
            publish: "",
          };
        }
        return {
          project,
          dryRun: "npm run publish:posts -- --project " + project + " --dry-run",
          publish: "npm run publish:posts -- --project " + project,
        };
      }

      function publishPreviewSteps() {
        return ["source validation", "folder sync", "published validation", "test", "build"];
      }

      function runnerActionAttribute(action) {
        if (action === "validate-source") return "data-run-action=\"validate-source\"";
        if (action === "publish-dry-run") return "data-run-action=\"publish-dry-run\"";
        return "data-run-action=\"" + escapeHtml(action) + "\"";
      }

      function renderRunnerAction(action, disabled) {
        const label = action.label || action.action;
        const command = action.displayCommand || action.action;
        const mutates = action.mutatesFiles ? "mutates files" : "safe check";
        return "<button class=\"runner-action-button\" " + runnerActionAttribute(action.action) + " type=\"button\"" + (disabled ? " disabled" : "") + ">" +
          "<span class=\"runner-action-label\">" + escapeHtml(label) + "</span>" +
          "<span class=\"runner-badge\">" + escapeHtml(mutates) + "</span>" +
          "<span class=\"runner-action-command\">" + escapeHtml(command) + "</span>" +
        "</button>";
      }

      function renderRunnerWarnings(preflight) {
        const warnings = preflight?.warnings || [];
        if (!warnings.length) return "";
        return warnings
          .map((warning) => "<div class=\"runner-message\">" + escapeHtml(warning.message || warning.code || warning) + "</div>")
          .join("");
      }

      function renderRunnerOutput(label, value, truncated) {
        const text = value || "";
        const warning = truncated ? "<div class=\"runner-truncated\">출력은 최근 32KB만 표시됩니다.</div>" : "";
        return "<div class=\"runner-result-row\"><strong>" + escapeHtml(label) + "</strong><div><pre class=\"runner-output\">" + escapeHtml(text || "-") + "</pre>" + warning + "</div></div>";
      }

      function renderRunnerResult() {
        const result = state.runnerResult;
        if (!result) return "";
        const exitCode = result.exitCode === undefined || result.exitCode === null ? "-" : result.exitCode;
        const displayCommand = result.displayCommand || result.command || "-";
        return "<div class=\"runner-result\">" +
          "<div class=\"runner-result-row\"><strong>status</strong><span>" + escapeHtml(result.status || "-") + "</span></div>" +
          "<div class=\"runner-result-row\"><strong>exitCode</strong><span>" + escapeHtml(exitCode) + "</span></div>" +
          "<div class=\"runner-result-row\"><strong>command</strong><code>" + escapeHtml(displayCommand) + "</code></div>" +
          renderRunnerOutput("stdout", result.stdout, result.stdoutTruncated) +
          renderRunnerOutput("stderr", result.stderr, result.stderrTruncated) +
          "<div class=\"runner-result-row\"><strong>next</strong><span>" + escapeHtml(result.nextAction || "-") + "</span></div>" +
        "</div>";
      }

      function runnerError() {
        return state.runnerRunError || state.runnerPreflightError || "";
      }

      function renderRunnerPreview() {
        const preview = publishPreviewCommands();
        const selectedProject = preview.project || "All Folders";
        const scopeNote = "Smart Views는 화면 필터일 뿐이며 runner action은 선택한 Folder 기준으로 실행됩니다.";
        if (!preview.project) {
          return "<div class=\"runner-preview\">" +
            "<div class=\"runner-head\"><span class=\"runner-title\">Controlled Runner</span><span class=\"runner-project\">" + escapeHtml(selectedProject) + "</span></div>" +
            "<div class=\"runner-message\">All Folders에서는 실행할 수 없습니다. 단일 Folder를 선택하세요.</div>" +
            "<div class=\"runner-note\">" + escapeHtml(scopeNote) + "</div>" +
          "</div>";
        }

        const steps = publishPreviewSteps()
